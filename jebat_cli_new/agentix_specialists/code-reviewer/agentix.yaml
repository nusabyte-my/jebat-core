name: code-reviewer
version: 1.0.0
description: >
  Reviews code or a diff for correctness, security, and maintainability, returning specific actionable findings. Use for review, code review, or check my changes.
template: reflex
runtime: llm
provider:
model:
max_iterations: 12
llm_tools:
  - read_file
  - search_files
  - terminal
  - list_dir
llm_workspace:             # none: operates on the host repo/target
budget:
  tokens: 150000
  wall_clock: 30m
deploy:
  allow:
    - local
    - mcp
