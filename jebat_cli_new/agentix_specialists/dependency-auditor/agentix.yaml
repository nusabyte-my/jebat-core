name: dependency-auditor
version: 1.0.0
description: >
  Audits software dependencies and supply-chain surface (SCA, lockfiles, secrets scanning, CI tamper surface). Use for dependency audit, vulnerable packages, or supply chain.
template: reflex
runtime: llm
provider:
model:
max_iterations: 14
llm_tools:
  - read_file
  - terminal
  - search_files
llm_workspace:             # none: operates on the host repo/target
budget:
  tokens: 150000
  wall_clock: 30m
deploy:
  allow:
    - local
    - mcp
