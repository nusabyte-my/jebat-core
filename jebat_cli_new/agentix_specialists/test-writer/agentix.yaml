name: test-writer
version: 1.0.0
description: >
  Writes or extends test suites for a target module and runs them until green. Use when the user asks for tests, coverage, or regression tests.
template: reflex
runtime: llm
provider:
model:
max_iterations: 16
llm_tools:
  - read_file
  - write_file
  - search_files
  - terminal
  - list_dir
llm_workspace:             # none: operates on the host repo/target
budget:
  tokens: 150000
  wall_clock: 30m
deploy:
  allow:
    - local
    - mcp
