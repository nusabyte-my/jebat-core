<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F7F4EE"/>
  <style>
    .display{font-family:'Space Grotesk',sans-serif;font-weight:700;fill:#141816}
    .copper{fill:#8A4F23}.body{font-family:Inter,sans-serif;fill:#5B6560}.mono{font-family:monospace;fill:#EDEFEF}.muted{fill:#A8AEAF}.label{font-family:Inter,sans-serif;font-weight:600;fill:#EDEFEF}
  </style>
  <text x="70" y="105" class="body" font-size="18">JEBAT · Self-hosted agent runtime</text>
  <text x="70" y="195" class="display" font-size="68">One command.</text>
  <text x="70" y="280" class="display copper" font-size="60">Every thread of work.</text>
  <text x="70" y="340" class="body" font-size="20">Governed agents. Shared evidence.</text>
  <text x="70" y="372" class="body" font-size="20">Your infrastructure.</text>
  <rect x="70" y="415" width="350" height="64" rx="5" fill="#A05D24"/>
  <text x="98" y="456" class="label" font-size="22">Install the command layer →</text>
  <rect x="680" y="80" width="450" height="450" rx="8" fill="#101112"/>
  <text x="710" y="120" class="mono" font-size="14">$ jebat agentix run --parallel 3</text>
  <line x1="710" y1="145" x2="1100" y2="145" stroke="#2B3033"/>
  <g>
    <rect x="710" y="175" width="120" height="130" rx="4" fill="#1A1D1F" stroke="#2B3033"/>
    <rect x="845" y="175" width="120" height="130" rx="4" fill="#1A1D1F" stroke="#2B3033"/>
    <rect x="980" y="175" width="120" height="130" rx="4" fill="#1A1D1F" stroke="#2B3033"/>
    <text x="725" y="205" class="mono" font-size="13" fill="#D58A4A">01</text><text x="725" y="240" class="label" font-size="14">Map surface</text>
    <text x="860" y="205" class="mono" font-size="13" fill="#D58A4A">02</text><text x="860" y="240" class="label" font-size="14">Trace tools</text>
    <text x="995" y="205" class="mono" font-size="13" fill="#D58A4A">03</text><text x="995" y="240" class="label" font-size="14">Review proof</text>
  </g>
  <line x1="710" y1="345" x2="1100" y2="345" stroke="#2B3033"/>
  <circle cx="730" cy="395" r="18" fill="none" stroke="#72D6A0" stroke-width="2"/>
  <path d="M722 395l6 6 11-13" fill="none" stroke="#72D6A0" stroke-width="2"/>
  <text x="765" y="402" class="label" font-size="18">One consolidated report</text>
  <text x="710" y="470" class="muted" font-family="Inter,sans-serif" font-size="14">Same model · isolated tools · recorded run</text>
</svg>
