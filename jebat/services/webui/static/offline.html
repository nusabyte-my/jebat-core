<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JEBAT WebUI — Offline</title>
<style>
:root{--malam:#080A09;--besi:#141816;--tulang:#F0EADF;--tembaga:#C97A40;--keluli:#99A39E;--pucuk:#2F6F55}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--malam);color:var(--tulang);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.box{max-width:440px;border:1px solid rgba(240,234,223,.12);border-radius:16px;padding:40px 32px;background:var(--besi)}
.sigil{font-size:44px;margin-bottom:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;margin-bottom:10px}
p{color:var(--keluli);font-size:13.5px;line-height:1.7;margin-bottom:20px}
.hint{border-top:1px solid rgba(240,234,223,.1);padding-top:16px;font-size:11.5px;color:var(--keluli)}
.hint b{color:var(--tembaga)}
</style>
</head>
<body>
<div class="box">
  <div class="sigil">🗡️</div>
  <h1>You're offline.</h1>
  <p>The JEBAT WebUI needs a live connection to reach the agent runtime. Cached pages still work — anything dynamic will reconnect when you're back.</p>
  <div class="hint">SW v8.2.1-agentix · when connectivity returns, <b>reload</b> and the shell will re-sync automatically.</div>
</div>
</body>
</html>
