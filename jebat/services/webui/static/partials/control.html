<!-- Control Center -->
<style>
  .control-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-md); }
</style>

<div>
  <h2 style="margin-bottom:var(--space-lg)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;opacity:.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg> Control Center</h2>

  <div class="control-grid">
    <!-- Runtime Status -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Runtime</div>
        <span class="badge badge-green" id="ctrl-runtime-status">Active</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm)">
        <div class="flex justify-between"><span class="text-sm text-muted">Provider</span><span class="text-sm font-mono" id="ctrl-provider">—</span></div>
        <div class="flex justify-between"><span class="text-sm text-muted">Model</span><span class="text-sm font-mono" id="ctrl-model">—</span></div>
        <div class="flex justify-between"><span class="text-sm text-muted">Profile</span><span class="text-sm font-mono" id="ctrl-profile">default</span></div>
      </div>
      <div class="mt-md">
        <button class="btn btn-sm" id="ctrl-refresh"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg> Refresh</button>
      </div>
    </div>

    <!-- Provider Auth -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Provider Auth</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm)">
        <select class="select" id="ctrl-auth-provider">
          <option value="">Select provider...</option>
        </select>
        <input class="input" id="ctrl-auth-secret" type="password" placeholder="API Key" />
        <button class="btn btn-primary btn-sm" id="ctrl-auth-save">Save Key</button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Quick Actions</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm)">
        <button class="btn" onclick="location.hash='#sahabat'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;opacity:.75"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Open Sahabat</button>
        <button class="btn" onclick="location.hash='#keris'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;opacity:.75"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Open Keris</button>
        <button class="btn" onclick="location.hash='#perisai'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;opacity:.75"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg> Open Perisai</button>
      </div>
    </div>

    <!-- System Info -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">System</div>
      </div>
      <div class="terminal" style="font-size:var(--font-size-xs)">
        <div><span class="prompt">$</span> jebat --version</div>
        <div class="output">JEBAT v8.2.1</div>
        <div><span class="prompt">$</span> python --version</div>
        <div class="output">Python 3.13.7</div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('ctrl-refresh')?.addEventListener('click', async () => {
    try {
      if (typeof API !== 'undefined') {
        const rt = await API.runtime();
        document.getElementById('ctrl-provider').textContent = rt.provider?.effective || '—';
        document.getElementById('ctrl-model').textContent = rt.provider?.model || '—';
        document.getElementById('ctrl-profile').textContent = rt.provider?.override?.provider || 'default';

        const catalog = rt.providers?.catalog || {};
        const sel = document.getElementById('ctrl-auth-provider');
        sel.innerHTML = '<option value="">Select provider...</option>';
        for (const name of Object.keys(catalog)) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        }
      }
    } catch {}
  });
  document.getElementById('ctrl-refresh')?.click();
  document.getElementById('ctrl-auth-save')?.addEventListener('click', async () => {
    const provider = document.getElementById('ctrl-auth-provider').value;
    const secret = document.getElementById('ctrl-auth-secret').value.trim();
    if (!provider || !secret) { window.toast?.('Select a provider and enter its credential.', 'warning'); return; }
    try {
      await API.providerAuth({ provider, secret });
      document.getElementById('ctrl-auth-secret').value = '';
      window.toast?.(`${provider} credential saved.`, 'success');
      document.getElementById('ctrl-refresh')?.click();
    } catch (error) {
      window.toast?.(error.message || 'Unable to save provider credential.', 'error');
    }
  });
</script>
