<!-- Channels -->
<style>
  .channel-icon { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
  .channel-icon svg { width: 18px; height: 18px; }
  .channel-icon.telegram { background: rgba(38,165,219,.12); color: #26A5DB; }
  .channel-icon.whatsapp { background: rgba(37,211,102,.12); color: #25D366; }
  .channel-icon.discord { background: rgba(88,101,242,.12); color: #5865F2; }
  .channel-icon.slack { background: rgba(74,21,75,.12); color: #4A154B; }
  .channel-card-header { display: flex; align-items: center; gap: 10px; }
  .channel-card-header .card-title { flex: 1; }
</style>
<div>
  <div class="page-header">
    <div><h2>Channels</h2><p class="text-muted">Connection readiness for JEBAT messaging adapters. Configure credentials in Control Center before activating a channel.</p></div>
  </div>
  <div class="grid grid-2" id="channels-grid"><div class="card text-muted">Loading channel readiness...</div></div>
</div>

<script>

  const stateClass = state => state === 'active' ? 'badge-green' : state === 'error' ? 'badge-red' : state === 'configured' ? 'badge-amber' : 'badge-muted';

  };

  async function loadChannels() {
    const data = await API.channels();
    channelsGrid.replaceChildren();
    (data.available || []).forEach(channel => {
      const current = data.connections?.[channel.id] || {};
      const card = document.createElement('article');
      card.className = 'card';
      const header = document.createElement('div');
      header.className = 'channel-card-header';
      const iconWrap = document.createElement('div');
      iconWrap.className = `channel-icon ${channel.id}`;
      iconWrap.innerHTML = CHANNEL_ICONS[channel.id] || '';
      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = channel.label;
      const badge = document.createElement('span');
      const state = current.status || 'not configured';
      badge.className = `badge ${stateClass(state)}`;
      badge.textContent = state;
      header.append(iconWrap, title, badge);
      const detail = document.createElement('p');
      detail.className = 'text-sm text-muted';
      detail.style.marginTop = '8px';
      detail.textContent = current.last_error || channel.instructions;
      const requirements = document.createElement('div');
      requirements.className = 'agent-profile-meta';
      (current.missing || channel.required || []).forEach(item => {
        const tag = document.createElement('span');
        tag.textContent = item;
        requirements.appendChild(tag);
      });
      card.append(header, detail, requirements);
      channelsGrid.appendChild(card);
    });
  }

  loadChannels().catch(() => { channelsGrid.textContent = 'Unable to load channel readiness.'; });
</script>
